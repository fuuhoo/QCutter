name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-mingw
            os: windows-2022
            # 与本地 Kit "Desktop Qt 5.12.12 MinGW 64-bit" 一致:
            #   Qt 5.12.12 + MinGW 7.3.0 (mingw73_64)
            #   vcpkg triplet: 内置 x64-mingw-dynamic + 项目自带的
            #   overlay triplet (cmake/vcpkg-triplets/x64-mingw-dynamic-qt.cmake)
            #   强制 _GLIBCXX_USE_CXX11_ABI=0, 与 Qt 5.12 自带的 libstdc++
            #   ABI 一致, 避免运行时 "filesystem::path::parent_path() 无法
            #   定位程序输入点".
            qt: '5.12'
            qt_arch: 'win64_mingw73'
            # Qt 5.12 没有 qtimageformats module (5.15+ 才有), 留空用基础组件.
            qt_modules: ''
            vcpkg_triplet: x64-mingw-dynamic-qt
            generator: Ninja
            artifact_ext: '7z'
            artifact_name: 'QCutter-windows-mingw'

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg binary caches
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            ~/.cache/vcpkg
          # v4: 切换到用 Qt 自带 mingw73 (GCC 7.3) 编译依赖, 旧的 mingw64
          # (GCC 14) ABI 缓存不能复用, 用新命名空间强制重建.
          key: vcpkg-${{ matrix.os }}-${{ matrix.vcpkg_triplet }}-qt${{ matrix.qt }}-v4
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.vcpkg_triplet }}-qt${{ matrix.qt }}-

      - name: Install vcpkg
        run: |
          if [ ! -x "$GITHUB_WORKSPACE/vcpkg/vcpkg" ]; then
            # Need full clone (not --depth 1) because vcpkg.json's builtin-baseline
            # points at a specific commit that must be reachable from the clone.
            git clone https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
            "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          else
            echo "vcpkg already installed"
          fi

      # Qt 必须先装: vcpkg install 需要用 Qt 自带的 mingw73 (GCC 7.3) 编译器,
      # 通过 env.QT_ROOT_DIR 引用. 如果 Qt 在 vcpkg 之后装, QT_ROOT_DIR 在
      # vcpkg install 时还没设, vcpkg 探测编译器就退回到 PATH 上的 cl.exe (MSVC),
      # detect_compiler 失败, install 直接报错退出.
      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true

      # install-qt-action@v4 只装 Qt 库 (DLLs/prl/pc), 不装 MinGW toolchain.
      # 本地 Kit "Desktop Qt 5.12.12 MinGW 64-bit" 用的是 Qt 离线安装器 bundle
      # 的 mingw730_64 (GCC 7.3.0, 在 D:\Qt\Qt5.12.12\Tools\mingw730_64\bin\).
      # CI 要对齐本地 Kit, 必须单独装这个 toolchain. 用 aqtinstall (install-qt
      # -action 内部用的就是它) 装 tools_mingw730, 落到 C:\Qt\Tools\mingw730_64\
      # bin\, 与本地路径一致.
      #
      # 关键: 用 mingw73 (GCC 7.3) 而非 MSYS2 mingw64 (GCC 14) 编译 QCutter.exe
      # **和 vcpkg 依赖**, 出来的 exe 大小/行为与本地 dev 3716 KB 完全一致
      # (用 GCC 14 编会膨胀到 4182 KB, 因为 GCC 14 stdlib 引入了更多符号; 并且
      # GCC 14 编的 vcpkg 依赖与 GCC 7.3 编的 exe 在 ABI=0 边界仍有 minor
      # 差异风险, std::list size 等会跨版本变化).
      #
      # vcpkg 的 scripts/toolchains/mingw.cmake 用 find_program 找
      # x86_64-w64-mingw32-gcc.exe (target-prefixed 名), 但 Qt mingw730_64 的
      # bin/ 里只有 gcc.exe (无前缀). 把 gcc.exe 复制成 x86_64-w64-mingw32-gcc.
      # exe 让 vcpkg 用 — GCC driver 看到 argv[0] 含 -w64-mingw32- 就用 target
      # triple, 与 mingw73 自身一致, 行为等价.
      - name: Install mingw73 toolchain
        run: |
          python -m pip install --quiet aqtinstall
          # Qt SDK 包命名 (Updates.xml 里实际定义):
          #   qt.tools.win64_mingw730 = MinGW 7.3.0 64-bit
          #   qt.tools.win64_mingw810 = MinGW 8.1.0 64-bit
          # 路径落到 C:/Qt/Tools/mingw730_64/bin/g++.exe
          python -m aqt install-tool windows desktop qt.tools.win64_mingw730 -O C:/Qt
          MINGW_BIN="/c/Qt/Tools/mingw730_64/bin"
          echo "--- mingw730_64 toolchain ---"
          ls -la "$MINGW_BIN/g++.exe"
          "$MINGW_BIN/g++.exe" --version | head -1
          # 复制成 vcpkg find_program 找的 target-prefixed 名 (cp 不用 admin,
          # 不需要 mklink). 只复制 driver, 其他工具 (ld/ar/as) 共享同一 bin/,
          # find_program 用 PATH 找到原 gcc.exe 旁边, 没问题.
          for tool in gcc g++ cpp cc c++ ld; do
            src="$MINGW_BIN/${tool}.exe"
            dst="$MINGW_BIN/x86_64-w64-mingw32-${tool}.exe"
            if [ -f "$src" ] && [ ! -f "$dst" ]; then
              cp -v "$src" "$dst"
            fi
          done
          echo "--- target-prefixed tool wrappers ---"
          ls -la "$MINGW_BIN/x86_64-w64-mingw32-"*.exe 2>&1 | head -10
          echo "MINGW73_TOOLCHAIN_ROOT=C:/Qt/Tools/mingw730_64" >> "$GITHUB_ENV"

      - name: Install vcpkg dependencies
        env:
          # 让 vcpkg 编译 tiff/sqlite 等依赖时也用 Qt 的 mingw73 (GCC 7.3),
          # 与 QCutter.exe 用同一编译器 — 避免 GCC 14 vcpkg 依赖 + GCC 7.3 exe
          # 跨版本 ABI 风险 (即使强制 ABI=0, std::list size 等仍有跨 GCC 版本
          # 差异). mingw73 bin/ 里同时有 gcc.exe 和我们 cp 出来的
          # x86_64-w64-mingw32-gcc.exe (vcpkg find_program 找的就是后者).
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
          # 项目自带的 overlay triplet (cmake/vcpkg-triplets/x64-mingw-dynamic-qt.cmake)
          # 在 vcpkg 内置 x64-mingw-dynamic 基础上强制 _GLIBCXX_USE_CXX11_ABI=0,
          # 让 vcpkg 编译的 tiff/sqlite 等依赖与 Qt 5.12 + QCutter 自身 ABI 一致.
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/vcpkg-triplets
        run: |
          # mingw73 bin 放 PATH 最前, vcpkg detect_compiler 就能找到 x86_64
          # -w64-mingw32-gcc.exe (我们 cp 出来的 wrapper).
          export PATH="/c/Qt/Tools/mingw730_64/bin:$PATH"
          echo "--- which gcc for vcpkg ---"
          which x86_64-w64-mingw32-gcc.exe || which x86_64-w64-mingw32-gcc
          x86_64-w64-mingw32-gcc --version | head -1
          # vcpkg.json 已在仓库里, vcpkg 自动进入 manifest 模式从该文件读取依赖.
          # 不需要传包名, 也不需要 --triplet (env 设置了).
          # 用 || true 防止 vcpkg install 失败导致后续 debug 命令被 pipefail 跳过.
          "$GITHUB_WORKSPACE/vcpkg/vcpkg" install 2>&1 | tee vcpkg-install.log || true
          echo "vcpkg install exit=${PIPESTATUS[0]}"
          # 把 vcpkg buildtrees 也上传以便诊断 detect_compiler 失败原因
          tar -czf vcpkg-buildtrees.tar.gz -C "$GITHUB_WORKSPACE/vcpkg" buildtrees 2>/dev/null || true
          # 把 detect_compiler 的所有日志都单独拷一份
          mkdir -p vcpkg-debug-logs
          find "$GITHUB_WORKSPACE/vcpkg/buildtrees/detect_compiler" \
            \( -name '*.log' -o -name 'CMakeCache.txt' \) \
            -exec cp -v {} vcpkg-debug-logs/ \; 2>/dev/null || true
          # 把整个 detect_compiler 目录打成一个 zip (buildtrees tar.gz 可能上传失败)
          (cd "$GITHUB_WORKSPACE/vcpkg/buildtrees" && zip -r "$GITHUB_WORKSPACE/QCutter/detect-compiler-dump.zip" detect_compiler 2>/dev/null) || true
          echo "--- vcpkg-debug-logs contents ---"
          ls -la vcpkg-debug-logs 2>&1 || true
          echo "--- detect-compiler-dump.zip size ---"
          ls -la detect-compiler-dump.zip 2>&1 || true
      - name: Upload vcpkg debug info (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-debug-${{ matrix.name }}
          path: |
            vcpkg-install.log
            vcpkg-buildtrees.tar.gz
            vcpkg-debug-logs
            detect-compiler-dump.zip

      - name: Configure
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
          # Configure 也要传 triplet/overlay, 否则 cmake 默认用 x64-windows
          # 会重新触发 vcpkg install 装一份错的 (MSVC ABI) 到 build/.
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/vcpkg-triplets
          # QCutter 用 Qt 自带的 mingw730_64 (GCC 7.3.0) 编, 与本地 dev Kit
          # 完全一致. 用 GCC 7.3 编出来的 exe (3716 KB) 才与本地 dev 一致;
          # 之前用 MSYS2 mingw64 (GCC 14) 编虽然能跑, 但 exe 膨胀到 4182 KB
          # (GCC 14 stdlib 引入了更多 c++17/20 符号), 与本地不符.
          #
          # ABI: mingw73 默认就是 cxx11 ABI=0, 与 Qt 5.12 mingw73 libstdc++
          # 完全一致, 不需要 _GLIBCXX_USE_CXX11_ABI=0 标志 (但 CMakeLists.txt
          # 里仍然强制, 保险).
          CMAKE_C_COMPILER: 'C:/Qt/Tools/mingw730_64/bin/gcc.exe'
          CMAKE_CXX_COMPILER: 'C:/Qt/Tools/mingw730_64/bin/g++.exe'
        run: |
          # PATH 里 mingw73 放最前, 避免 cmake 选 MSVC 或 MSYS2 mingw64.
          export PATH="/c/Qt/Tools/mingw730_64/bin:$PATH"
          cmake -S . -B build \
            -G ${{ matrix.generator }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER='C:/Qt/Tools/mingw730_64/bin/gcc.exe' \
            -DCMAKE_CXX_COMPILER='C:/Qt/Tools/mingw730_64/bin/g++.exe' \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Package
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        run: |
          rm -rf stage
          mkdir -p stage
          # Ninja: build/QCutter / build/QCutter.exe (exe 在 build 根目录)
          find build -maxdepth 2 \( -name 'QCutter' -o -name 'QCutter.exe' \) \
            -type f -executable -exec cp {} stage/ \; 2>/dev/null || true
          echo "--- stage contents before DLL copy ---"
          ls -la stage

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          if [ -n "$QT_ROOT_DIR" ] && [ -d "$QT_ROOT_DIR" ]; then
            # Qt5Core/Gui/Widgets/Network/Sql/PrintSupport dll
            if [ -d "$QT_ROOT_DIR/bin" ]; then
              for d in Qt5Core Qt5Gui Qt5Widgets Qt5Network Qt5Sql Qt5PrintSupport \
                Qt5Concurrent; do
                find "$QT_ROOT_DIR/bin" -maxdepth 1 -name "${d}.dll" -exec cp -v {} stage/ \; 2>/dev/null || true
              done
            fi
            # platforms/qwindows.dll 必须放在 platforms/ 子目录
            if [ -d "$QT_ROOT_DIR/plugins/platforms" ]; then
              mkdir -p stage/platforms
              cp -v "$QT_ROOT_DIR/plugins/platforms/qwindows.dll" stage/platforms/ 2>/dev/null || true
            fi
            # mingw 运行时 DLLs: QCutter 现在用 Qt 自带的 mingw730_64 (GCC 7.3)
            # 编, 运行时 DLL 从 C:/Qt/Tools/mingw730_64/bin 取, 这是 Qt 离线
            # 安装器 bundle 的 mingw73 toolchain.
            # -static-libstdc++/-static-libgcc 已经在 link options 里, 所以
            # libstdc++-6.dll / libgcc_s_seh-1.dll 不需要 (静态链进去了).
            # libwinpthread-1.dll Qt 链了, 必须拷.
            if [ -d /c/Qt/Tools/mingw730_64/bin ]; then
              for d in libwinpthread-1 libgcc_s_seh-1 libstdc++-6; do
                find /c/Qt/Tools/mingw730_64/bin -maxdepth 1 -name "${d}.dll" -exec cp -v {} stage/ \; 2>/dev/null || true
              done
            fi
          fi

          # vcpkg manifest 模式默认装到 <source>/vcpkg_installed/<triplet>/bin.
          # 如果 Configure 把 vcpkg_instaled 切到 build/ 下 (通过 VCPKG_INSTALLED_DIR),
          # 那就去找 build/vcpkg_installed/. 三个路径都试一下, 谁有就拷谁.
          # 注意: vcpkg 在 manifest 模式下会同时装 release 和 debug 两套 bin/,
          # debug 版的 dll 带 d 后缀 (libtiffd-6.dll / libzd.dll), exe 链的是
          # release 版, 用 debug 版 dll 会导致符号不一致. 只拷 release bin/.
          for _vcpkg_dir in \
            "$GITHUB_WORKSPACE/QCutter/vcpkg_installed" \
            "$GITHUB_WORKSPACE/vcpkg_installed" \
            "$GITHUB_WORKSPACE/build/vcpkg_installed"; do
            if [ -d "$_vcpkg_dir" ]; then
              echo "vcpkg_installed dir: $_vcpkg_dir"
              find "$_vcpkg_dir" -path '*/bin/*.dll' -not -path '*/debug/*' -exec cp -v {} stage/ \; 2>/dev/null || true
              break
            fi
          done

          echo "--- stage contents before archive ---"
          ls -la stage

          # 打包成 7z
          if [ "${{ matrix.artifact_ext }}" = "7z" ]; then
            (cd stage && 7z a "../${{ matrix.artifact_name }}.7z" . 2>&1) || {
              (cd stage && zip -r "../${{ matrix.artifact_name }}.zip" .)
              mv "${{ matrix.artifact_name }}.zip" "${{ matrix.artifact_name }}.7z"
            }
          else
            tar czf "${{ matrix.artifact_name }}.tar.gz" -C stage .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.artifact_ext }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/QCutter-windows-mingw/QCutter-windows-mingw.7z
          generate_release_notes: true
          draft: false
          prerelease: false
