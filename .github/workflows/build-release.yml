name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-mingw
            os: windows-2022
            # 与本地 Kit "Desktop Qt 5.12.12 MinGW 64-bit" 一致:
            #   Qt 5.12.12 + MinGW 7.3.0 (mingw73_64)
            #   vcpkg triplet: 内置 x64-mingw-dynamic + 项目自带的
            #   overlay triplet (cmake/vcpkg-triplets/x64-mingw-dynamic-qt.cmake)
            #   强制 _GLIBCXX_USE_CXX11_ABI=0, 与 Qt 5.12 自带的 libstdc++
            #   ABI 一致, 避免运行时 "filesystem::path::parent_path() 无法
            #   定位程序输入点".
            qt: '5.12'
            qt_arch: 'win64_mingw73'
            # Qt 5.12 没有 qtimageformats module (5.15+ 才有), 留空用基础组件.
            qt_modules: ''
            vcpkg_triplet: x64-mingw-dynamic-qt
            generator: Ninja
            artifact_ext: '7z'
            artifact_name: 'QCutter-windows-mingw'

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg binary caches
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            ~/.cache/vcpkg
          # v4: 切换到用 Qt 自带 mingw73 (GCC 7.3) 编译依赖, 旧的 mingw64
          # (GCC 14) ABI 缓存不能复用, 用新命名空间强制重建.
          key: vcpkg-${{ matrix.os }}-${{ matrix.vcpkg_triplet }}-qt${{ matrix.qt }}-v4
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.vcpkg_triplet }}-qt${{ matrix.qt }}-

      - name: Install vcpkg
        run: |
          if [ ! -x "$GITHUB_WORKSPACE/vcpkg/vcpkg" ]; then
            # Need full clone (not --depth 1) because vcpkg.json's builtin-baseline
            # points at a specific commit that must be reachable from the clone.
            git clone https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
            "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          else
            echo "vcpkg already installed"
          fi

      # Qt 必须先装: vcpkg install 需要用 Qt 自带的 mingw73 (GCC 7.3) 编译器,
      # 通过 env.QT_ROOT_DIR 引用. 如果 Qt 在 vcpkg 之后装, QT_ROOT_DIR 在
      # vcpkg install 时还没设, vcpkg 探测编译器就退回到 PATH 上的 cl.exe (MSVC),
      # detect_compiler 失败, install 直接报错退出.
      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true

      - name: Install vcpkg dependencies
        env:
          # 强制 vcpkg 用 Qt 自带的 mingw73 (GCC 7.3) 编译 sqlite3/tiff/zlib 等依赖,
          # 与 QCutter.exe + Qt5.12 mingw73 的 libstdc++ ABI 一致. 如果用 MSYS2
          # mingw64 (GCC 14+), 编译出的 .a ABI 跟 mingw73 不一致, 链接时 std::filesystem
          # 等符号在 mingw73 libstdc++.a 里找不到 (GCC 9+ 移除了 ABI=0 的符号).
          PATH: ${{ env.QT_ROOT_DIR }}/bin:${{ env.PATH }}
          # CC/CXX 是 cmake LANGUAGES 项目初始化时的最高优先级, vcpkg 探测编译器
          # (detect_compiler) 时会读到, 不受 vcpkg 内部 cmake 调用方式影响.
          CC: ${{ env.QT_ROOT_DIR }}/bin/gcc.exe
          CXX: ${{ env.QT_ROOT_DIR }}/bin/g++.exe
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
          # 项目自带的 overlay triplet (cmake/vcpkg-triplets/x64-mingw-dynamic-qt.cmake)
          # 在 vcpkg 内置 x64-mingw-dynamic 基础上强制 _GLIBCXX_USE_CXX11_ABI=0,
          # 让 vcpkg 编译的 tiff/sqlite 等依赖与 Qt 5.12 + QCutter 自身 ABI 一致.
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/vcpkg-triplets
          # vcpkg 内部的 detect_compiler 走 scripts/toolchains/mingw.cmake, 它
          # find_program(CMAKE_C_COMPILER "x86_64-w64-mingw32-gcc") — Qt 的
          # mingw73_64/bin 下没有带目标前缀的副本 (只有 gcc.exe), find_program
          # 返回 NOTFOUND, enable_language(C) 失败 → detect_compiler 报
          # "unable to detect the active compiler's information".
          # 解: 提前把 CMAKE_C/CXX_COMPILER 写入 cmake cache, mingw.cmake 里
          # find_program 是非 cache 调用, 不会覆盖. detect_compiler 自己的
          # CMakeLists.txt 对 Windows+Ninja 已经设了 CMAKE_C_COMPILER_WORKS=1
          # 和 CMAKE_C_COMPILER_FORCED=1, 跳过编译器自检直接用.
          VCPKG_CMAKE_CONFIGURE_OPTIONS: >-
            -DCMAKE_C_COMPILER=${{ env.QT_ROOT_DIR }}/bin/gcc.exe
            -DCMAKE_CXX_COMPILER=${{ env.QT_ROOT_DIR }}/bin/g++.exe
        run: |
          # vcpkg.json 已在仓库里, vcpkg 自动进入 manifest 模式从该文件读取依赖.
          # 不需要传包名, 也不需要 --triplet (env 设置了).
          "$GITHUB_WORKSPACE/vcpkg/vcpkg" install 2>&1 | tee vcpkg-install.log
          echo "vcpkg-install.log exit=$?"
          # 把 vcpkg buildtrees 也上传以便诊断 detect_compiler 失败原因
          tar -czf vcpkg-buildtrees.tar.gz -C "$GITHUB_WORKSPACE/vcpkg" buildtrees 2>/dev/null || true
          # 把 detect_compiler 的关键日志单独拷一份 (buildtrees tar 可能太大上传失败)
          mkdir -p vcpkg-debug-logs
          find "$GITHUB_WORKSPACE/vcpkg/buildtrees/detect_compiler" -maxdepth 3 \
            \( -name 'config-*.log' -o -name 'stdout-*.log' -o -name 'CMakeCache.txt' \) \
            -exec cp -v {} vcpkg-debug-logs/ \; 2>/dev/null || true
          ls -la vcpkg-debug-logs 2>&1 || true
      - name: Upload vcpkg debug info (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-debug-${{ matrix.name }}
          path: |
            vcpkg-install.log
            vcpkg-buildtrees.tar.gz
            vcpkg-debug-logs

      - name: Configure
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
          # Configure 也要传 triplet/overlay, 否则 cmake 默认用 x64-windows
          # 会重新触发 vcpkg install 装一份错的 (MSVC ABI) 到 build/.
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/vcpkg-triplets
          # 关键: 强制 cmake + vcpkg 用 Qt 自带的 mingw73 (GCC 7.3). 默认
          # PATH 上有 MSYS2 mingw64 (GCC 14+), 如果 cmake 自动选它, 链接的
          # libstdc++.a 是 GCC 14 的, GCC 9+ 移除了 ABI=0 的 std::filesystem
          # 等符号. QCutter 用 -D_GLIBCXX_USE_CXX11_ABI=0 强制 ABI=0, 链接器
          # 找不到符号 → undefined reference, 即使编出 exe 运行时 std::filesystem
          # 调用会用错 ABI 的符号 → 启动 segfault.
          CMAKE_C_COMPILER: ${{ env.QT_ROOT_DIR }}/bin/gcc.exe
          CMAKE_CXX_COMPILER: ${{ env.QT_ROOT_DIR }}/bin/g++.exe
          # 让 vcpkg 编译依赖 (sqlite3/tiff/zlib 等) 时也用 Qt 自带的 mingw73,
          # 不要用 MSYS2 mingw64. 否则依赖和 QCutter.exe 用不同 GCC 编, ABI 不一致.
          VCPKG_CMAKE_CONFIGURE_OPTIONS: >-
            -DCMAKE_C_COMPILER=${{ env.QT_ROOT_DIR }}/bin/gcc.exe
            -DCMAKE_CXX_COMPILER=${{ env.QT_ROOT_DIR }}/bin/g++.exe
        run: |
          # PATH 里 Qt mingw73 放最前, 避免 cmake 选 MSYS2 mingw64.
          # 同时影响 g++/ld (链接阶段) 和 vcpkg 找编译器.
          export PATH="${{ env.QT_ROOT_DIR }}/bin:$PATH"
          # 强制指定 triplet (vcpkg cmake toolchain 优先用 CMAKE_C_COMPILER 推断,
          # 在 windows-2022 runner 上 cl.exe 在 PATH 里就被推断成 x64-windows).
          cmake -S . -B build \
            -G ${{ matrix.generator }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${{ env.QT_ROOT_DIR }}/bin/gcc.exe" \
            -DCMAKE_CXX_COMPILER="${{ env.QT_ROOT_DIR }}/bin/g++.exe" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Package
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        run: |
          rm -rf stage
          mkdir -p stage
          # Ninja: build/QCutter / build/QCutter.exe (exe 在 build 根目录)
          find build -maxdepth 2 \( -name 'QCutter' -o -name 'QCutter.exe' \) \
            -type f -executable -exec cp {} stage/ \; 2>/dev/null || true
          echo "--- stage contents before DLL copy ---"
          ls -la stage

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          if [ -n "$QT_ROOT_DIR" ] && [ -d "$QT_ROOT_DIR" ]; then
            # Qt5Core/Gui/Widgets/Network/Sql/PrintSupport dll
            if [ -d "$QT_ROOT_DIR/bin" ]; then
              for d in Qt5Core Qt5Gui Qt5Widgets Qt5Network Qt5Sql Qt5PrintSupport \
                Qt5Concurrent; do
                find "$QT_ROOT_DIR/bin" -maxdepth 1 -name "${d}.dll" -exec cp -v {} stage/ \; 2>/dev/null || true
              done
            fi
            # platforms/qwindows.dll 必须放在 platforms/ 子目录
            if [ -d "$QT_ROOT_DIR/plugins/platforms" ]; then
              mkdir -p stage/platforms
              cp -v "$QT_ROOT_DIR/plugins/platforms/qwindows.dll" stage/platforms/ 2>/dev/null || true
            fi
            # mingw build 静态链接了 libstdc++/libgcc 进 exe (避免与 Qt
            # 自带的 libstdc++-6.dll ABI mismatch), 但 libgcc 的 SEH
            # exception handling 部分仍要 libgcc_s_seh-1.dll 运行时支持.
            # winpthread 也是动态链接. include libstdc++-6.dll 作为
            # 兜底 (静态链接失败时仍可启动).
            if [ -d "$QT_ROOT_DIR/bin" ]; then
              for d in libgcc_s_seh-1 libwinpthread-1 libstdc++-6; do
                find "$QT_ROOT_DIR/bin" -maxdepth 1 -name "${d}.dll" -exec cp -v {} stage/ \; 2>/dev/null || true
              done
            fi
          fi

          # vcpkg manifest 模式默认装到 <source>/vcpkg_installed/<triplet>/bin.
          # 如果 Configure 把 vcpkg_instaled 切到 build/ 下 (通过 VCPKG_INSTALLED_DIR),
          # 那就去找 build/vcpkg_installed/. 三个路径都试一下, 谁有就拷谁.
          # 注意: vcpkg 在 manifest 模式下会同时装 release 和 debug 两套 bin/,
          # debug 版的 dll 带 d 后缀 (libtiffd-6.dll / libzd.dll), exe 链的是
          # release 版, 用 debug 版 dll 会导致符号不一致. 只拷 release bin/.
          for _vcpkg_dir in \
            "$GITHUB_WORKSPACE/QCutter/vcpkg_installed" \
            "$GITHUB_WORKSPACE/vcpkg_installed" \
            "$GITHUB_WORKSPACE/build/vcpkg_installed"; do
            if [ -d "$_vcpkg_dir" ]; then
              echo "vcpkg_installed dir: $_vcpkg_dir"
              find "$_vcpkg_dir" -path '*/bin/*.dll' -not -path '*/debug/*' -exec cp -v {} stage/ \; 2>/dev/null || true
              break
            fi
          done

          echo "--- stage contents before archive ---"
          ls -la stage

          # 打包成 7z
          if [ "${{ matrix.artifact_ext }}" = "7z" ]; then
            (cd stage && 7z a "../${{ matrix.artifact_name }}.7z" . 2>&1) || {
              (cd stage && zip -r "../${{ matrix.artifact_name }}.zip" .)
              mv "${{ matrix.artifact_name }}.zip" "${{ matrix.artifact_name }}.7z"
            }
          else
            tar czf "${{ matrix.artifact_name }}.tar.gz" -C stage .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.artifact_ext }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/QCutter-windows-mingw/QCutter-windows-mingw.7z
          generate_release_notes: true
          draft: false
          prerelease: false
