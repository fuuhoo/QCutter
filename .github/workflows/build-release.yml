name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-2022
            vcpkg_triplet: x64-windows
            qt: '5.15'
            qt_arch: 'win64_msvc2019_64'
            qt_modules: ''
            generator: Ninja
            artifact_ext: '7z'
            artifact_name: 'QCutter-windows-msvc'
          - name: windows-mingw
            os: windows-2022
            vcpkg_triplet: x64-mingw-dynamic
            qt: '5.15'
            qt_arch: 'win64_mingw81'
            qt_modules: ''
            generator: Ninja
            artifact_ext: '7z'
            artifact_name: 'QCutter-windows-mingw'
          - name: ubuntu
            os: ubuntu-22.04
            vcpkg_triplet: x64-linux
            qt: '5.15'
            qt_arch: 'gcc_64'
            qt_modules: ''
            generator: Ninja
            artifact_ext: 'tar.gz'
            artifact_name: 'QCutter-linux'

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg binary caches
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ matrix.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.vcpkg_triplet }}-

      - name: Install vcpkg
        run: |
          if [ ! -x "$GITHUB_WORKSPACE/vcpkg/vcpkg" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
            "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          else
            echo "vcpkg already installed"
          fi

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          # vcpkg.json 已在仓库里, vcpkg 自动进入 manifest 模式从该文件读取依赖.
          # 不需要传包名, 也不需要 --triplet (env 设置了).
          "$GITHUB_WORKSPACE/vcpkg/vcpkg" install

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true

      - name: Setup MSVC dev cmd (windows-msvc only)
        if: matrix.name == 'windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          # windows-msvc uses ilammy/msvc-dev-cmd (sets up cl.exe in PATH).
          # Ninja with MSVC tools works; cmake finds cl.exe via PATH.
          cmake -S . -B build \
            -G ${{ matrix.generator }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_PREFIX_PATH="${{ steps.Install-Qt.outputs.QT_PREFIX_PATH }}"

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Strip binary (linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          find build -maxdepth 2 -name 'QCutter*' -type f -executable -exec strip -s {} \; 2>/dev/null || true

      - name: Package
        run: |
          rm -rf stage
          mkdir -p stage
          # Ninja: build/QCutter / build/QCutter.exe
          # Visual Studio (Release config): build/Release/QCutter.exe
          find build -maxdepth 3 \( -name 'QCutter' -o -name 'QCutter.exe' \) \
            -type f -executable -exec cp {} stage/ \; 2>/dev/null || true
          # Windows: 复制 Qt + vcpkg DLL (Qt 安装器把 Qt5*.dll 放在 QT_PREFIX_PATH 根目录)
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            QT_ROOT="${{ steps.Install-Qt.outputs.QT_PREFIX_PATH }}"
            # Qt5*.dll + 一些 vcpkg DLL (libtiff-5, sqlite3 等)
            for d in Qt5Core Qt5Gui Qt5Widgets Qt5Network Qt5Sql Qt5PrintSupport \
              Qt5Concurrent libtiff-5 libsqlite3-0; do
              find "$QT_ROOT" -maxdepth 1 -name "${d}.dll" -exec cp {} stage/ \; 2>/dev/null || true
            done
            # vcpkg manifest 模式装到 source tree 的 vcpkg_installed/<triplet>/bin
            find "$GITHUB_WORKSPACE/QCutter/vcpkg_installed" -name "*.dll" -exec cp {} stage/ \; 2>/dev/null || true
            # platforms/qwindows.dll 必须放在 platforms/ 子目录
            PLUGINS="$QT_ROOT/plugins"
            if [ -d "$PLUGINS/platforms" ]; then
              mkdir -p stage/platforms
              cp "$PLUGINS/platforms/qwindows.dll" stage/platforms/ 2>/dev/null || true
            fi
          fi
          # 打包
          if [ "${{ matrix.artifact_ext }}" = "7z" ]; then
            (cd stage && 7z a "../${{ matrix.artifact_name }}.7z" . 2>&1) || {
              (cd stage && zip -r "../${{ matrix.artifact_name }}.zip" .)
              mv "${{ matrix.artifact_name }}.zip" "${{ matrix.artifact_name }}.7z"
            }
          else
            tar czf "${{ matrix.artifact_name }}.tar.gz" -C stage .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.artifact_ext }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/QCutter-windows-msvc/QCutter-windows-msvc.7z
            artifacts/QCutter-windows-mingw/QCutter-windows-mingw.7z
            artifacts/QCutter-linux/QCutter-linux.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
